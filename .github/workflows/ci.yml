name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[all]" pytest

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest tests -q

      - name: Install coverage measurement
        if: matrix.python-version == '3.12'
        run: python -m pip install pytest-cov

      - name: Run tests with branch coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest tests -q --cov=cellstine --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Retain coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-3.12-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Check source-function review inventory
        run: python tools/review_inventory.py --check

  minimum_numpy:
    name: Core helpers on NumPy 1.26
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core package with minimum NumPy series
        run: python -m pip install -e . "numpy==1.26.4" pytest

      - name: Check structure helper compatibility
        run: >-
          python -m pytest
          tests/test_species_bounds.py
          tests/test_supercell_coset_resources.py
          tests/test_structure_helper_scales.py
          tests/test_transforms_rotations.py -q

  package:
    name: Package build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel

      - name: Check package metadata
        run: python -m twine check dist/*
