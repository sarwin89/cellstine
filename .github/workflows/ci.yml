name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[all]" pytest

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest tests -q

      - name: Install coverage measurement
        if: matrix.python-version == '3.12'
        run: python -m pip install pytest-cov

      - name: Run tests with branch coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest tests -q --cov=cellstine --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Retain coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-3.12-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Check source-function review inventory
        run: python tools/review_inventory.py --check

  minimum_numpy:
    name: Core helpers on NumPy 1.26
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core package with minimum NumPy series
        run: python -m pip install -e . "numpy==1.26.4" pytest

      - name: Check structure helper compatibility
        run: >-
          python -m pytest
          tests/test_species_bounds.py
          tests/test_supercell_coset_resources.py
          tests/test_structure_helper_scales.py
          tests/test_transforms_rotations.py
          tests/test_core_infrastructure.py
          tests/test_provenance_resources.py
          tests/test_validation.py
          tests/test_report.py
          tests/test_output_reservations.py
          tests/test_io_integrity.py
          tests/test_kpoints_integrity.py
          tests/test_io.py
          tests/test_io_scaling_factor.py
          tests/test_kpoints_layout.py
          tests/test_reciprocal_integrity.py
          tests/test_conventional_resources.py
          tests/test_json_writer_resources.py
          tests/test_defect_record_resources.py
          tests/test_moire_persistence_validation.py
          tests/test_cli_discovery_resources.py
          tests/test_cli_command_preview_resources.py
          tests/test_moire_builder_resources.py
          tests/test_symmetry_resources.py
          tests/test_reciprocal_path_resources.py
          tests/test_saved_preview_resources.py -q

  portable_results:
    name: Portable results on ${{ matrix.os }} / Python ${{ matrix.runtime.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        runtime:
          - python: "3.10"
            numpy: "numpy>=1.26,<3"
          - python: "3.12"
            numpy: "numpy==1.26.4"
          - python: "3.14"
            numpy: "numpy>=1.26,<3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.runtime.python }}
          cache: pip
      - name: Install core package and portable result dependencies
        run: python -m pip install -e . "${{ matrix.runtime.numpy }}" pytest
      - name: Check archive and consumer portability
        run: python -m pytest -q tests/test_moire_npz_persistence.py tests/test_moire_result_formats.py

  package:
    name: Package build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel

      - name: Check package metadata
        run: python -m twine check dist/*
